services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerly}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerly}
    volumes: ["ledgerly-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runtime
    command: ["bun", "--cwd", "apps/api", "db:migrate"]
    environment:
      DATABASE_URL: ${API_DATABASE_URL:-postgres://ledgerly:ledgerly@postgres:5432/ledgerly}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: ${API_DATABASE_URL:-postgres://ledgerly:ledgerly@postgres:5432/ledgerly}
      API_TOKEN: ${API_TOKEN:-local-development-token}
      PORT: 3000
    ports: ["${API_PORT:-3000}:3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:3000/health/ready');if(!r.ok)process.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    command: ["bun", "apps/api/src/worker.ts"]
    environment:
      DATABASE_URL: ${API_DATABASE_URL:-postgres://ledgerly:ledgerly@postgres:5432/ledgerly}
      API_TOKEN: ${API_TOKEN:-local-development-token}
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

volumes:
  ledgerly-data:
