worker_processes 1;
pid /app/run/nginx.pid;
error_log /app/run/nginx-error.log warn;
events { worker_connections 256; }
http {
  access_log /app/run/nginx-access.log;
  client_body_temp_path /app/run/client_body;
  proxy_temp_path /app/run/proxy_temp;
  fastcgi_temp_path /app/run/fastcgi_temp;
  uwsgi_temp_path /app/run/uwsgi_temp;
  scgi_temp_path /app/run/scgi_temp;
  server {
    listen 8080;
    server_name _;
    auth_basic "TCStock browser";
    auth_basic_user_file /app/run/htpasswd;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /internal/ { return 404; }
    location /browser/ {
      proxy_pass http://127.0.0.1:6081/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }
    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_set_header Host $host;
    }
  }
}
