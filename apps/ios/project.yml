name: Ledgerly
options:
  bundleIdPrefix: com.ledgerly
  deploymentTarget:
    iOS: "18.0"
targets:
  Ledgerly:
    type: application
    platform: iOS
    sources: [Ledgerly]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledgerly.app
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    scheme:
      testTargets: []
