name: Ledgerly
options:
  bundleIdPrefix: com.ledgerly
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  Ledgerly:
    type: application
    platform: iOS
    sources: [Ledgerly]
    info:
      path: Ledgerly/Info.plist
      properties:
        LedgerlyBaseURL: $(LEDGERLY_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Ledgerly connects to your self-hosted server on the local network to sync your financial data.
        NSPhotoLibraryUsageDescription: Ledgerly reads the newest screenshot you choose to import a payment into your selected account. OCR stays on this iPhone.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledgerly.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.8
        CURRENT_PROJECT_VERSION: 9
        GENERATE_INFOPLIST_FILE: YES
        LEDGERLY_BASE_URL: http://10.99.1.6:3000
    scheme:
      testTargets: [LedgerlyTests]
  LedgerlyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LedgerlyTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ledgerly
