name: Ledgerly
options:
  bundleIdPrefix: com.ledgerly
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  Ledgerly:
    type: application
    platform: iOS
    sources: [Ledgerly]
    entitlements:
      path: Ledgerly/Ledgerly.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: Ledgerly/Info.plist
      properties:
        LedgerlyBaseURL: $(LEDGERLY_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Ledgerly connects to your self-hosted server on the local network to sync your financial data.
        NSPhotoLibraryUsageDescription: Ledgerly reads only the payment screenshot you explicitly choose. OCR stays on this iPhone.
        NSFaceIDUsageDescription: Ledgerly uses Face ID to unlock your financial information on this iPhone.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledgerly.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.6.2
        CURRENT_PROJECT_VERSION: 23
        GENERATE_INFOPLIST_FILE: YES
        LEDGERLY_BASE_URL: http://localhost:3000
    scheme:
      testTargets: [LedgerlyTests]
  LedgerlyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LedgerlyTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ledgerly
