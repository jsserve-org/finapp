apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: com.ledgerly.app
    intents:
    - metadata:
        name: AddOneTimeBillIntent_0
        title: Add One-Time Bill
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Add a bill in ${+applicationName}'
          - '{${+prefix} }Create a bill in ${+applicationName}'
    - metadata:
        name: AddRecurringBillIntent_1
        title: Add Recurring Bill
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Add a recurring bill in ${+applicationName}'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - Ledgerly
- name: BillFrequency
  type: ssu/parameter
  definitions:
  - locale: en
    synomyms:
    - Weekly
    - Every 2 weeks
    - Monthly
    - Yearly
- name: BillAccountEntity
  type: ssu/parameter
  definitions:
  - locale: en
    synomyms:
    - Ledgerly Account
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
